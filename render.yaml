services:
  - type: web
    name: lead-enrichment-backend
    env: node
    rootDir: backend
    buildCommand: "npm install --include=dev && npm run build && npx playwright install chromium && npx puppeteer browsers install chrome"
    startCommand: "npm start"
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: PUPPETEER_CACHE_DIR
        value: "/opt/render/project/src/backend/.cache"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: "Simplifi-IQ Assessment"
      - key: ENABLE_GOOGLE_INTEGRATIONS
        value: "false"
      - key: GOOGLE_SHEETS_CREDENTIALS
        sync: false
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
